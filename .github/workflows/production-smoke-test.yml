name: Production Smoke Test

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'production'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve production commit
        id: commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/production | cut -f1)"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi

          if [ -z "$sha" ]; then
            echo "Unable to resolve production commit."
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Production commit: $sha"

      - name: Wait for matching Render deploy
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          auth_header="Authorization: Bearer $RENDER_API_KEY"
          api_base="https://api.render.com/v1/services/$RENDER_SERVICE_ID"

          service_json="$(curl --fail --silent --show-error \
            --header "Accept: application/json" \
            --header "$auth_header" \
            "$api_base")"

          service_url="$(printf '%s' "$service_json" | jq -r '.serviceDetails.url // empty')"
          if [ -z "$service_url" ]; then
            echo "Render service URL is missing."
            exit 1
          fi

          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "Waiting for Render deploy of $TARGET_SHA"

          deploy_id=""
          for attempt in $(seq 1 60); do
            deploys_json="$(curl --fail --silent --show-error \
              --header "Accept: application/json" \
              --header "$auth_header" \
              "$api_base/deploys?limit=100")"

            deploy_id="$(printf '%s' "$deploys_json" | jq -r --arg sha "$TARGET_SHA" '
              [ .[] | .deploy | select(.commit.id == $sha) ][0].id // empty
            ')"

            if [ -n "$deploy_id" ]; then
              break
            fi

            echo "Deploy not visible yet (attempt $attempt/60)"
            sleep 10
          done

          if [ -z "$deploy_id" ]; then
            echo "No Render deploy found for commit $TARGET_SHA."
            exit 1
          fi

          echo "Found Render deploy: $deploy_id"

          for attempt in $(seq 1 60); do
            deploy_json="$(curl --fail --silent --show-error \
              --header "Accept: application/json" \
              --header "$auth_header" \
              "$api_base/deploys/$deploy_id")"

            status="$(printf '%s' "$deploy_json" | jq -r '.status')"
            echo "Render deploy status: $status"

            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deploy failed with status: $status"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Render deploy to become live."
          exit 1

      - name: Smoke test production health
        env:
          SERVICE_URL: ${{ steps.render.outputs.service_url }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$SERVICE_URL/api/health")"

          echo "Health response: $response"

          status="$(printf '%s' "$response" | jq -r '.status // empty')"
          if [ "$status" != "ok" ]; then
            echo "Unexpected health response."
            exit 1
          fi

          echo "Production smoke test passed for $EXPECTED_SHA."
