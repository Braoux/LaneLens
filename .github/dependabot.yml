version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris

    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    target-branch: main

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Paris